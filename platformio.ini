; PlatformIO build for the Autosport Labs ESP32-CAN-X2.
;
; This sits alongside the existing Arduino IDE sketch rather than replacing it:
; src_dir points at ps-controller/, so both toolchains build exactly the same
; files and nothing had to move. The Arduino IDE keeps working unchanged.
;
; Why the pioarduino platform rather than the official espressif32 one:
; Espressif stopped maintaining official PlatformIO support, so the registry
; platform is pinned to arduino-esp32 2.0.17. That core predates the aslcanx2
; board variant, and it is a different ESP-IDF generation (4.4 vs 5.x) than the
; Arduino IDE builds with, which matters here because the firmware leans on the
; TWAI driver. The fork ships the 3.x core the IDE already flashes.
;
; Note: the host-side unit tests under test/ are NOT PlatformIO unit tests.
; They build and run on the host with `make -C test` (see README).

[platformio]
src_dir = ps-controller

[env:aslcanx2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Board settings taken from the aslcanx2 entry in the arduino-esp32 boards.txt.
; The module is an ESP32-S3-WROOM-1-N8R8. PSRAM is left disabled to match the
; Arduino IDE's default menu selection; the firmware does not need it.
board_build.variant = aslcanx2
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    -DARDUINO_ASL_CAN_X2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; Provides mcp_canbus.h for the MCP2515 on CAN 2.
lib_deps =
    https://github.com/Longan-Labs/Arduino_CAN_BUS_MCP2515.git

monitor_speed = 115200
